[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chatlens"
version = "1.0.0"
description = "微信群聊分析工具 — 统计分析 / AI 智能分析 / 多格式报告生成，支持 Web + CLI + MCP 三端接入"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ChatLens contributors"},
]
keywords = ["wechat", "group-chat", "analysis", "report", "mcp", "ai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "mcp==1.26.0",
    "Jinja2==3.1.6",
    "Pillow>=12.2.0",
    "PyMuPDF==1.27.2.3",
    "zstandard==0.25.0",
    "jieba>=0.42",
    "requests>=2.33.0",
    "openai==2.31.0",
    "psutil>=5.9",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mypy>=1.0",
    "ruff>=0.4",
]

[project.urls]
Homepage = "https://github.com/MeetMX-ai/chatlens"
Repository = "https://github.com/MeetMX-ai/chatlens"
Issues = "https://github.com/MeetMX-ai/chatlens/issues"

[project.scripts]
wxcli = "chatlens.plugins.cli.commands:main"

[tool.setuptools.packages.find]
include = ["chatlens*"]

[tool.setuptools.package-data]
chatlens = ["web/*.html", "web/*.css", "web/*.js", "report_templates/**/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["chatlens", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.lint.isort]
known-first-party = ["chatlens"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--strict-markers"
# CI 通过 --junitxml=... 显式指定输出文件；此处仅配 family
junit_family = "xunit2"
markers = [
    "e2e: end-to-end integration tests (require web fixtures, run via -m e2e)",
    "integration: integration tests (real components, not mocked)",
    "slow: slow tests (>1s)",
]

[tool.coverage.run]
source = ["chatlens"]
omit = ["tests/*", "chatlens/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
fail_under = 50
