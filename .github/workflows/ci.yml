name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Unit (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pytest (unit)
        run: |
          python -m pytest tests/ --ignore=tests/e2e -q --tb=line --no-header \
            -n auto --timeout=60 \
            --junitxml=test-results.xml

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: |
            test-results.xml
          if-no-files-found: warn

      - name: Check exit codes
        if: failure()
        run: |
          echo "::error::CI failed. Check artifacts for details."

  e2e:
    name: E2E (ubuntu-latest / py3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Pytest (e2e)
        run: |
          python -m pytest tests/e2e -q --tb=line --no-header \
            --timeout=120 \
            --junitxml=test-results.xml

      - name: Upload test results (JUnit XML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            test-results.xml
          if-no-files-found: warn

      - name: Check exit codes
        if: failure()
        run: |
          echo "::error::CI failed. Check artifacts for details."

  perf-scan:
    name: Performance anti-pattern scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run perf anti-pattern scanner
        run: python scripts/perf_anti_patterns.py --fail-on high
